name: AutoFlow agent

# Copy to .github/workflows/ in the project. Every task is designed first (docs/issue-N.md), then built
# after you reply 确认. Reply 继续 to resume an interrupted run. Pin AutoFlow to a release tag or commit.
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  autoflow:
    uses: ouraihub/AutoFlow/.github/workflows/agent.yml@878bf1716d54c072e52fdc8d4cbc2d22dfd4ea9c # v0.2.2
    with:
      model: ${{ vars.AI_MODEL }}
      setup: '' # e.g. pnpm install --frozen-lockfile
      checks: '' # e.g. pnpm test
    secrets:
      AI_KEYS: ${{ secrets.AI_KEYS }}
      AUTOFLOW_TOKEN: ${{ secrets.AUTOFLOW_TOKEN }}
