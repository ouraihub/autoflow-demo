name: AI review

# Copy to .github/workflows/ in the project. pull_request_target runs this file from the default
# branch, so a PR cannot change its own review. Pin AutoFlow to a release tag or commit.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: autoflow-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  autoflow:
    uses: ouraihub/AutoFlow/.github/workflows/review.yml@e6f0e59d18f1619ba278be9012456af20604c85f # v0.2.1
    with:
      model: ${{ vars.AI_MODEL }}
    secrets:
      AI_KEYS: ${{ secrets.AI_KEYS }}
      AUTOFLOW_TOKEN: ${{ secrets.AUTOFLOW_TOKEN }}
